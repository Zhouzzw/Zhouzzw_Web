<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#111}iframe{border:0;display:block}
pre{font:12px/1.4 monospace;color:#0f0;margin:0;padding:4px;white-space:pre}</style>
</head><body>
<iframe id="f" src="/Zhouzzw_Web/"></iframe>
<pre id="out">pending</pre>
<script>
  const q = new URLSearchParams(location.search);
  const f = document.getElementById('f');
  f.style.width = '1440px'; f.style.height = '900px';
  f.addEventListener('load', () => {
    const w = f.contentWindow, d = f.contentDocument, L = [];
    if (q.get('y') !== null) {
      w.scrollTo({ top: parseInt(q.get('y'), 10), behavior: 'instant' });
      document.getElementById('out').style.display = 'none';
      return;
    }
    const edge = (sel) => {
      let maxText = 0, rowRight = 0;
      d.querySelectorAll(sel + ' .timeline-list__item').forEach(it => {
        const rr = it.getBoundingClientRect().right;
        rowRight = Math.max(rowRight, rr);
        it.querySelectorAll('h3, p, li').forEach(n => {
          const range = d.createRange();
          range.selectNodeContents(n);
          const rb = range.getBoundingClientRect();
          if (rb.width > 0) maxText = Math.max(maxText, rb.right);
        });
      });
      return sel + '  行右边界=' + Math.round(rowRight) +
        '  文字最右=' + Math.round(maxText) +
        '  死区=' + Math.round(rowRight - maxText) + 'px';
    };
    L.push(edge('#honors'));
    L.push(edge('#internship'));
    L.push('结果列数量=' + d.querySelectorAll('.timeline-list__award').length +
      '（期望 7：荣誉 6 ＋ 实习 1）');
    document.getElementById('out').textContent = L.join('\n');
  });
</script></body></html>
